[package]
name = "colors-le"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
description = "Find every colour in a codebase, and say which are not in your palette"
authors = ["Nolin D Naidoo"]
homepage = "https://letools.dev/tools/colors-le"
repository = "https://github.com/nolindnaidoo/colors-le"
keywords = ["colors", "css", "palette", "design-system", "cli"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# What a consumer gets, and why.
#
# Ships: src/, Cargo.toml, Cargo.lock, LICENSE, README.md — needed to
# build the binary. SPEC.md and CHANGELOG.md — the behavioural contract
# someone scripting against the exit codes needs. tests/ and fixtures/ —
# not needed to *build* (verified: the crate compiles without them), but
# needed to *verify*: `cargo test` on the unpacked tarball runs the full
# corpus, so the parity claims in the README are checkable by whoever
# installed it rather than taken on trust.
#
# Excluded: AGENTS.md and CLAUDE.md are how this repo is worked on, not
# how the tool is used. rust-toolchain.toml is a convenience for
# contributors to *this* checkout; shipped, it would pin the toolchain
# of anyone who unpacks or vendors the crate, which is not this crate's
# business.
exclude = ["AGENTS.md", "CLAUDE.md", "rust-toolchain.toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One regex engine, for the key-name test and for turning an exclude
# glob into a matcher. Neither needs backreferences or lookaround, so
# `regex` expresses them exactly and its matching cannot fail.
regex = "1"
# The walker. `ignore` is ripgrep's, so "what this tool walks" and "what
# ripgrep walks" are the same answer — which is the answer a person
# auditing a repository already has in their head.
ignore = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A colour channel is clamped to [0, 255] on the line above the cast, so
# it can neither truncate nor lose a sign. Writing the conversion as
# fallible would add an unreachable branch and a `.unwrap_or` that lies
# about what can happen.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# `.env` is compared case-sensitively on purpose. The extension does the
# same, and matching loosely here would have the two frontends disagree
# about which files exist — a `.ENV` is not a name anyone writes, and
# inventing one to satisfy a lint would be the divergence.
case_sensitive_file_extension_comparisons = "allow"
